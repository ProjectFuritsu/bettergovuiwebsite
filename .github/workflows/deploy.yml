name: Deploy to GitHub Pages

# Publishes the site on every push to main. Needs Pages turned on once, with "GitHub Actions" as the source:
# Settings → Pages → Build and deployment → Source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a deploy that has started always finishes
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Tells the build which folder the site is served from: /bettergovuiwebsite/ on github.io, / with a custom domain
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # GitHub Pages can't send every address to index.html, but it shows 404.html for addresses it doesn't know,
      # so a copy of the app there opens /components/button and the rest when someone follows a link or reloads
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
